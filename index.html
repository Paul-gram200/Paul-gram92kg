<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCHYTEC PAUL</title>
<style>
body{margin:0;background:#f0f2f5;font-family:Arial;padding:10px}
.card{background:#fff;max-width:500px;margin:12px auto;border-radius:15px;padding:18px;text-align:center;box-shadow:0 2px 8px #0002}
.card img{width:110px;height:110px;border-radius:50%;border:4px solid #0095f6;object-fit:cover}
.btn{padding:11px 20px;border-radius:25px;color:#fff;text-decoration:none;margin:5px;display:inline-block;font-weight:bold}
.blue{background:#0095f6}.green{background:#25D366}
.post{background:#fff;max-width:500px;margin:12px auto;border-radius:15px;padding:12px;box-shadow:0 2px 8px #0002}
.post img,.post video{width:100%;border-radius:12px;margin-top:8px;background:#000}
.post b{display:block;padding:8px}
#gallery{text-align:center;color:#666;padding:20px}
</style></head><body>

<div class="card">
<img src="picha1.jpeg" onerror="this.src='https://via.placeholder.com/110'">
<h2>ARCHYTEC PAUL</h2>
<p>Architect • Ramani za Kisasa<br>📍 Mbeya, TZ<br>📞 0675120043</p>
<a class="btn blue" href="tel:0675120043">Piga Simu</a>
<a class="btn green" href="https://wa.me/255675120043">WhatsApp</a>
</div>

<div id="gallery">Inapakia picha na video zako...</div>

<script>
async function loadGallery(){
  const gallery = document.getElementById('gallery');
  try{
    const res = await fetch('https://api.github.com/repos/Paul-gram200/Paul-gram92kg/contents');
    const files = await res.json();
    gallery.innerHTML='';
    
    files.forEach(file=>{
      const name = file.name.toLowerCase();
      if(name.match(/\.(jpg|jpeg|png|gif|webp)$/)){
        if(name==='picha1.jpeg') return; // usirudie ya juu
        const div = document.createElement('div');
        div.className='post';
        div.innerHTML=`<b>${file.name}</b><img src="${file.name}" loading="lazy">`;
        gallery.appendChild(div);
      }
      if(name.match(/\.(mp4|mov|webm|avi)$/)){
        const div = document.createElement('div');
        div.className='post';
        div.innerHTML=`<b>${file.name}</b><video controls playsinline><source src="${file.name}" type="video/mp4"></video>`;
        gallery.appendChild(div);
      }
    });
    if(gallery.innerHTML==='') gallery.innerHTML='Hakuna picha/video nyingine bado. Pandisha file mpya!';
  }catch(e){
    gallery.innerHTML='Imeshindwa kupakia. Hakikisha GitHub Pages iko ON.';
  }
}
loadGallery();
</script>
</body></html>
